[package]
name = "probe-sign"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Signs an app bundle with a development certificate, without Apple's codesign. For the install test."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
apple-codesign = { version = "=0.29.0", default-features = false }
x509-certificate = "0.24"
rsa = "0.9"
rand = "0.8"
pem = "3"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
